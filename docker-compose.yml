version: "3.9"

services:
  aurora-nav:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-nav
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - AURORA_PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["/usr/local/bin/aurora-nav", "--status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
