name: Deploy to GitHub Pages

on:
  push:
    branches: [devin/1773587117-aurora-nav-phase0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # The web engine is the Rust workspace compiled to WASM. Building it
      # here guarantees engine fixes always ship — the committed artifact
      # can never go stale on the deployed site.
      - name: Build WASM engine
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.114 --locked
          cargo build --target wasm32-unknown-unknown --release -p gane-wasm
          ~/.cargo/bin/wasm-bindgen --target web --out-dir app/client/public/engine \
            target/wasm32-unknown-unknown/release/gane_wasm.wasm

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build client (served under /nav-gan-1/)
        working-directory: app
        env:
          BASE_PATH: /nav-gan-1/
        run: pnpm exec vite build

      - name: SPA fallback
        run: cp app/dist/public/index.html app/dist/public/404.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      # Inlined actions/upload-pages-artifact: the composite references
      # upload-artifact by tag internally, which this repo's pin-to-SHA
      # actions policy rejects. deploy-pages only needs a single-tar
      # artifact named "github-pages".
      - name: Package Pages artifact
        run: tar --dereference --hard-dereference --directory app/dist/public -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
