name: CI

on:
  push:
    branches: [main, master, "devin/**"]
  pull_request:
    branches: [main, master, "devin/**", "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Org policy requires all actions pinned to a full-length commit SHA.
# The Rust toolchain is provisioned via rustup (preinstalled on runners).
# NOTE: Swatinem/rust-cache is intentionally NOT used — its post-job step
# crashes with "Argument list too long" on this 2,452-crate workspace.
# Restore caching after the workspace de-bloat (see GANE-NAV-MASTER-BLUEPRINT
# Section 4).

jobs:
  check:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable)
        run: rustup update stable && rustup default stable
      - run: cargo build --all-targets
      - run: cargo check --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable + clippy)
        run: rustup update stable && rustup default stable && rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable)
        run: rustup update stable && rustup default stable
      - name: Run tests
        run: cargo test --workspace
      - name: Verify test count
        run: |
          COUNT=$(cargo test --workspace 2>&1 | grep "^test result:" | awk '{sum += $4} END {print sum}')
          echo "Total tests: $COUNT"
          if [ "$COUNT" -lt 870 ]; then
            echo "ERROR: Expected 870+ tests but found $COUNT"
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable + rustfmt)
        run: rustup update stable && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --all -- --check

  bench-compile:
    name: Benchmarks Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable)
        run: rustup update stable && rustup default stable
      - run: cargo bench --no-run

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable)
        run: rustup update stable && rustup default stable
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  wasm:
    name: WASM Core Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable + wasm32 target)
        run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown -p gane-wasm -p aurora-core -p aurora-routing -p aurora-map -p aurora-gnss -p aurora-fusion -p aurora-integrity
