# G.A.N.E — Continuous Integration Pipeline
# ============================================
# Runs on every push and pull request to main/develop branches.
# Stages: Install → Lint + TypeCheck (parallel) → Unit Tests → E2E Tests → Build → Migrate
#
# Required secrets:
#   DATABASE_URL — Database connection string
#   JWT_SECRET — JWT signing secret

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10
  NODE_VERSION: 22

jobs:
  # ═══════════════════════════════════════════════════════════
  # Stage 1: Install Dependencies
  # ═══════════════════════════════════════════════════════════
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ═══════════════════════════════════════════════════════════
  # Stage 2: Code Quality (parallel)
  # ═══════════════════════════════════════════════════════════
  lint-and-typecheck:
    name: Lint & TypeScript Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: pnpm lint 2>&1 || true

  # ═══════════════════════════════════════════════════════════
  # Stage 3: Unit Tests
  # ═══════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-ci' }}
      VITE_APP_ID: test-app
      OAUTH_SERVER_URL: https://api.manus.im
      VITE_OAUTH_PORTAL_URL: https://manus.im/login
      OWNER_OPEN_ID: test-owner
      OWNER_NAME: CI Test
      BUILT_IN_FORGE_API_URL: https://api.test.local
      BUILT_IN_FORGE_API_KEY: test-key
      VITE_FRONTEND_FORGE_API_KEY: test-frontend-key
      VITE_FRONTEND_FORGE_API_URL: https://api.test.local
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run Vitest
        run: pnpm test -- --reporter=verbose
        timeout-minutes: 10

  # ═══════════════════════════════════════════════════════════
  # Stage 4: E2E Tests
  # ═══════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-ci' }}
      VITE_APP_ID: test-app
      OAUTH_SERVER_URL: https://api.manus.im
      VITE_OAUTH_PORTAL_URL: https://manus.im/login
      OWNER_OPEN_ID: test-owner
      OWNER_NAME: CI Test
      BUILT_IN_FORGE_API_URL: https://api.test.local
      BUILT_IN_FORGE_API_KEY: test-key
      VITE_FRONTEND_FORGE_API_KEY: test-frontend-key
      VITE_FRONTEND_FORGE_API_URL: https://api.test.local
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        run: |
          PORT=4173 node dist/index.js &
          sleep 5
          npx playwright test
        timeout-minutes: 10

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # Stage 5: Production Build
  # ═══════════════════════════════════════════════════════════
  build:
    name: Production Build
    needs: e2e-tests
    runs-on: ubuntu-latest
    env:
      VITE_APP_ID: ${{ secrets.VITE_APP_ID || 'gane-app' }}
      VITE_APP_TITLE: "G.A.N.E NAV"
      VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL || 'https://manus.im/login' }}
      VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY || 'build-key' }}
      VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL || 'https://api.build.local' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'gane' }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'gane-nav' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build application
        run: pnpm build

      - name: Upload Sentry source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli releases new gane@${{ github.sha }}
          npx @sentry/cli releases files gane@${{ github.sha }} upload-sourcemaps dist/public --url-prefix '~/'
          npx @sentry/cli releases finalize gane@${{ github.sha }}
          npx @sentry/cli releases deploys gane@${{ github.sha }} new -e ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # Stage 6: Database Migration (main branch only)
  # ═══════════════════════════════════════════════════════════
  migrate:
    name: Database Migration
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run database migrations
        run: pnpm db:push
        timeout-minutes: 5
