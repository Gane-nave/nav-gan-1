# G.A.N.E — Alertmanager Configuration
# =======================================
# Routes alerts to appropriate notification channels.
# Supports webhook, email, and Slack integrations.

global:
  resolve_timeout: 5m
  # Uncomment and configure for email notifications:
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@gane.app'
  # smtp_auth_username: 'alerts@gane.app'
  # smtp_auth_password: '<app-password>'
  # smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ─── Routing Tree ───
route:
  # Default receiver for unmatched alerts
  receiver: "default-webhook"
  # Group alerts by component and severity
  group_by: ["alertname", "component", "severity"]
  # Wait before sending initial notification (allows grouping)
  group_wait: 30s
  # Wait before sending updates to existing groups
  group_interval: 5m
  # Wait before re-sending a resolved alert
  repeat_interval: 4h

  routes:
    # Critical alerts → immediate notification
    - match:
        severity: critical
      receiver: "critical-webhook"
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Warning alerts → standard notification
    - match:
        severity: warning
      receiver: "default-webhook"
      group_wait: 1m
      repeat_interval: 4h

    # Redis-specific alerts → infrastructure team
    - match:
        component: redis
      receiver: "infrastructure-webhook"
      group_wait: 15s
      repeat_interval: 2h

    # WebSocket capacity alerts → real-time team
    - match:
        component: websocket
      receiver: "realtime-webhook"
      group_wait: 15s
      repeat_interval: 1h

# ─── Receivers ───
receivers:
  # Default webhook receiver
  - name: "default-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:3000/api/webhooks/alerts"
        send_resolved: true
        http_config:
          basic_auth:
            username: "alertmanager"
            password: "changeme"

  # Critical alerts — higher priority
  - name: "critical-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:3000/api/webhooks/alerts?priority=critical"
        send_resolved: true
        http_config:
          basic_auth:
            username: "alertmanager"
            password: "changeme"

    # Uncomment for Slack integration:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#gane-alerts-critical'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    #     send_resolved: true

  # Infrastructure team
  - name: "infrastructure-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:3000/api/webhooks/alerts?team=infrastructure"
        send_resolved: true

  # Real-time/WebSocket team
  - name: "realtime-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:3000/api/webhooks/alerts?team=realtime"
        send_resolved: true

# ─── Inhibition Rules ───
# Suppress lower-severity alerts when higher-severity ones are active
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "component"]
