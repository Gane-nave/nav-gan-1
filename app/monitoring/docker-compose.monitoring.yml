# G.A.N.E — Full Monitoring Stack
# ==================================
# Prometheus + Alertmanager + Grafana + Jaeger
#
# Usage:
#   cd monitoring && docker compose -f docker-compose.monitoring.yml up -d
#
# Access:
#   Prometheus:   http://localhost:9090
#   Alertmanager: http://localhost:9093
#   Grafana:      http://localhost:3001 (admin/admin)
#   Jaeger UI:    http://localhost:16686

version: "3.8"

services:
  # ─── Prometheus ───
  prometheus:
    image: prom/prometheus:latest
    container_name: gane-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    depends_on:
      - alertmanager
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Alertmanager ───
  alertmanager:
    image: prom/alertmanager:latest
    container_name: gane-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Grafana ───
  grafana:
    image: grafana/grafana:latest
    container_name: gane-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/gane-dashboard.json
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/gane-dashboard.json:ro
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Jaeger (Distributed Tracing) ───
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gane-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
      - "4317:4317"     # OTLP gRPC receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  jaeger-data:
