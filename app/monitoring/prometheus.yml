# G.A.N.E — Prometheus Configuration
# ====================================
# Scrapes the /metrics endpoint exposed by the Node.js application.
#
# Usage with Docker:
#   docker run -d --name prometheus \
#     -p 9090:9090 \
#     -v $(pwd)/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml \
#     prom/prometheus
#
# Usage with Grafana:
#   docker run -d --name grafana \
#     -p 3001:3000 \
#     grafana/grafana
#   Then import monitoring/grafana-dashboard.json

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ─── Alerting Configuration ───
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# ─── Alert Rules ───
rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "gane-app"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          app: "gane"
          environment: "production"

  # If running multiple instances behind a load balancer:
  # - job_name: "gane-cluster"
  #   dns_sd_configs:
  #     - names: ["gane-app.internal"]
  #       type: "A"
  #       port: 3000
