[package]
name = "gane-wasm"
version.workspace = true
edition.workspace = true
description = "G.A.N.E NAV engine facade for WebAssembly (browser / Capacitor)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
gane-core = { path = "../gane-core" }
gane-map = { path = "../gane-map" }
gane-routing = { path = "../gane-routing" }
gane-fusion = { path = "../gane-fusion" }
gane-integrity = { path = "../gane-integrity" }
gane-osm-import = { path = "../gane-osm-import" }
nalgebra = { workspace = true }
