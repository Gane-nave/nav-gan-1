[package]
name = "gane-compliance"
version = "0.1.0"
edition = "2021"
description = "Compliance & audit — GDPR, data retention policies, audit logging, regulatory compliance"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
