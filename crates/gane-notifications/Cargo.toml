[package]
name = "gane-notifications"
version = "0.1.0"
edition = "2021"
description = "Notification system — push notifications, geo-fence alerts, proximity warnings, scheduled alerts"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
