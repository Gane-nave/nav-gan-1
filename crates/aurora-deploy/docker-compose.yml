# =============================================================================
# AURORA NAV / GMIN — Docker Compose (Development / Local Testing)
# =============================================================================

services:
  aurora-nav:
    build:
      context: ../..
      dockerfile: crates/aurora-deploy/Dockerfile
    container_name: aurora-nav
    ports:
      - "3000:3000"
    environment:
      - AURORA_LOG_LEVEL=debug
      - AURORA_LOG_FORMAT=json
      - AURORA_API_HOST=0.0.0.0
      - AURORA_API_PORT=3000
      - RUST_BACKTRACE=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 128M
          cpus: "0.5"
    networks:
      - aurora-net

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: aurora-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      aurora-nav:
        condition: service_healthy
    networks:
      - aurora-net
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: aurora-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aurora
    depends_on:
      - prometheus
    networks:
      - aurora-net
    profiles:
      - monitoring

networks:
  aurora-net:
    driver: bridge
