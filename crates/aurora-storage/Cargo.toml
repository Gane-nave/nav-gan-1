[package]
name = "aurora-storage"
version = "0.1.0"
edition = "2021"
description = "Persistent storage layer — time-series data, key-value store, migrations, backup/restore"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
